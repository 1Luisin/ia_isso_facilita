[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ia-isso-facilita"
version = "0.1.0"
description = "Bot de curadoria e publicacao de promocoes de tecnologia com links de afiliado."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
isso-facilita = "isso_facilita.cli:main"
isso-facilita-ai-control = "isso_facilita.desktop_control:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isso_facilita"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

